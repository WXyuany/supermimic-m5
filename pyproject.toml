[project]
name = "supermimic-m5"
version = "0.1.0"
description = "Apple M5 reproduction of SuperMimic: MPS learning, CPU MuJoCo physics, LAFAN1 tracking"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Base framework, pinned to the exact commit the plan was written against (main, 2026-10-18).
  "mjlab",
  # Declared directly so that our [tool.uv.sources] below apply (mjlab's own sources do not propagate).
  "torch==2.14.1",
  "warp-lang==1.18.0",
  "mujoco-warp~=3.16.0",
  "mujoco~=3.16.0",
  "numpy==2.5.4",
  "imageio==2.38.1",
  "imageio-ffmpeg==0.6.0",
  "pillow==13.0.0",
  "matplotlib==3.11.2",
  "scipy>=1.15",
  "tensorboard>=2.20.0",
  "tyro>=1.0.1",
  "huggingface-hub>=0.30",
  "pandas",
  "pyarrow",
  "tqdm",
]

[project.scripts]
sm-train = "supermimic.scripts.train:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
  "pyright>=1.1.400",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/supermimic"]

[tool.uv.sources]
mjlab = { git = "https://github.com/mujocolab/mjlab", rev = "8bb2bc9e187797689ec82c78c35019afd2fd0376" }
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
